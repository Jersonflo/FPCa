<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Atlas · Estrella norte: rosa de los vientos facetada, con el norte en menta -->
  <defs>
    <linearGradient id="lit" x1="32" y1="3" x2="32" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b8fff0"/>
      <stop offset=".32" stop-color="#eef4fb"/>
      <stop offset="1" stop-color="#bad7f5"/>
    </linearGradient>
    <linearGradient id="shade" x1="32" y1="3" x2="32" y2="61" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5fd9c0"/>
      <stop offset=".32" stop-color="#9fb3e6"/>
      <stop offset="1" stop-color="#6f7bd0"/>
    </linearGradient>
    <linearGradient id="ring" x1="6" y1="10" x2="58" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#98ffe8" stop-opacity=".7"/>
      <stop offset=".5" stop-color="#9aa5f0" stop-opacity=".25"/>
      <stop offset="1" stop-color="#9aa5f0" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#98ffe8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#98ffe8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Anillo de brújula -->
  <circle cx="32" cy="32" r="25" stroke="url(#ring)" stroke-width="1"/>
  <circle cx="32" cy="32" r="20.5" stroke="#9aa5f0" stroke-opacity=".18" stroke-width=".8" stroke-dasharray="1 3.2"/>

  <!-- Puntas diagonales (secundarias) -->
  <g fill="#b9c4f5" fill-opacity=".75">
    <path d="M32 32L46.8 17.2 33.3 31.2z"/>
    <path d="M32 32L46.8 46.8 32.8 33.3z"/>
    <path d="M32 32L17.2 46.8 30.7 32.8z"/>
    <path d="M32 32L17.2 17.2 31.2 30.7z"/>
  </g>

  <!-- Brillo detrás del norte -->
  <circle cx="32" cy="9" r="7" fill="url(#glow)"/>

  <!-- Estrella principal en facetas (mitad clara / mitad en sombra) -->
  <path d="M32 3Q33.6 30.4 55 32H32z" fill="url(#lit)"/>
  <path d="M32 3Q30.4 30.4 9 32H32z" fill="url(#shade)"/>
  <path d="M32 61Q30.4 33.6 9 32H32z" fill="url(#lit)"/>
  <path d="M32 61Q33.6 33.6 55 32H32z" fill="url(#shade)"/>

  <!-- Centro -->
  <circle cx="32" cy="32" r="1.6" fill="#ffffff"/>
</svg>
